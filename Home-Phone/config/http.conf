; Asterisk's web server, used only by ARI: Test D (tests/testd.py) and the Ganpath service.
; Off unless HOME_PHONE_ARI_PASSWORD or HOME_PHONE_GANPATH_ARI_PASSWORD is set in the root
; .env; the entrypoint fills in yes/no.
; Loopback only: with host networking, only processes on this VM can reach it.
[general]
enabled=${HOME_PHONE_ARI_ENABLED}
bindaddr=127.0.0.1
bindport=8088
; No status page (it is on by default).
enable_status=no
