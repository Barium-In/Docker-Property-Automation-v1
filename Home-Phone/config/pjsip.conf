; The fibre landline, registered from this host.
; Rendered from the root .env at container start: no number or password lives in git.
; Only one device should register the line, so switch the account off in any softphone.

[global]
type=global
user_agent=Home-Phone
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=${HOME_PHONE_BIND}:5060

[airtel-auth]
type=auth
auth_type=userpass
username=${HOME_PHONE_SIP_NUMBER}@${HOME_PHONE_SIP_DOMAIN}
password=${HOME_PHONE_SIP_PASSWORD_CONF}

[airtel-reg]
type=registration
transport=transport-udp
outbound_auth=airtel-auth
server_uri=sip:${HOME_PHONE_SIP_DOMAIN}
client_uri=sip:${HOME_PHONE_SIP_NUMBER}@${HOME_PHONE_SIP_DOMAIN}
contact_user=${HOME_PHONE_SIP_NUMBER}
outbound_proxy=sip:${HOME_PHONE_SIP_PROXY}\;lr
expiration=600
retry_interval=60
forbidden_retry_interval=600
max_retries=10000
line=yes
endpoint=airtel

[airtel]
type=aor
contact=sip:${HOME_PHONE_SIP_DOMAIN}
outbound_proxy=sip:${HOME_PHONE_SIP_PROXY}\;lr

[airtel]
type=endpoint
transport=transport-udp
context=from-airtel
disallow=all
allow=alaw,ulaw
aors=airtel
outbound_auth=airtel-auth
outbound_proxy=sip:${HOME_PHONE_SIP_PROXY}\;lr
from_user=${HOME_PHONE_SIP_NUMBER}
from_domain=${HOME_PHONE_SIP_DOMAIN}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=auto
; Test D: with ARI on, a hold goes to the carrier as a re-INVITE (a=sendonly) instead of
; local music. The entrypoint sets yes only when HOME_PHONE_ARI_PASSWORD is set, so stage 1
; keeps the default (no).
moh_passthrough=${HOME_PHONE_MOH_PASSTHROUGH}
trust_id_inbound=yes

; Calls are accepted only from the carrier's proxy. There is no anonymous
; endpoint, so a SIP request from anywhere else is refused.
[airtel-identify]
type=identify
endpoint=airtel
match=${HOME_PHONE_SIP_PROXY}
