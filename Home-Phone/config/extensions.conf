; Stage 1: prove the line works from this host. No assistant yet.
;
; A call from a number in HOME_PHONE_TEST_CALLERS is answered with "hello world" and a beep:
;   press 1 (or nothing): echo test, you hear your own voice back (two-way audio check)
;   press 2:              transfer test, Asterisk asks the carrier to move the call (SIP REFER)
;   press 3:              bridge test, Asterisk places a second call to the forward number and
;                         joins the two (needs the line to carry two calls at once)
;   press 4:              hold-then-dial test (Test D). tests/testd.py must be running and ARI
;                         must be on (HOME_PHONE_ARI_PASSWORD set); otherwise an error beep.
; With HOME_PHONE_TEST_MODE=deflect the call is not answered; Asterisk asks the
; carrier to redirect it instead (SIP 302). Every other caller just hears ringing.
;
; Test D, E2 (tests/testd.py --wait-in): while the script holds a caller it sets the global
; TESTD_WAIT=1, and a call in from a test number or the forward number goes to the script.
; Press 4 also runs Test D4 (tests/testd.py --conf), which sends its REFERs through
; [testd-refer] at the end of this file (--conf --flash sends none).
;
; NOTICE lines show only the last 4 digits of a number.

[globals]
TEST_CALLERS=${HOME_PHONE_TEST_CALLERS}
TEST_FORWARD=${HOME_PHONE_TEST_FORWARD}
TEST_MODE=${HOME_PHONE_TEST_MODE}
SIP_DOMAIN=${HOME_PHONE_SIP_DOMAIN}
TESTD_WAIT=0

[from-airtel]
exten => _[+0-9].,1,Goto(inbound,s,1)
exten => s,1,Goto(inbound,s,1)

[inbound]
exten => s,1,GotoIf($["${TESTD_WAIT}" = "1"]?holdin)
 same => n(start),Set(LAST10=${CALLERID(num):-10})
 same => n,Log(NOTICE,Incoming call from a number ending in ${CALLERID(num):-4})
 same => n,GotoIf($[${LEN(${LAST10})} != 10]?not_test)
 same => n,GotoIf($["${TEST_CALLERS}" =~ "${LAST10}"]?test)
 same => n(not_test),Log(NOTICE,Not a test caller: letting it ring)
 same => n,Ringing()
 same => n,Wait(40)
 same => n,Hangup()

 same => n(test),GotoIf($["${TEST_MODE}" = "deflect"]?deflect)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Read(CHOICE,beep,1,,1,8)
 same => n,GotoIf($["${CHOICE}" = "2"]?refer)
 same => n,GotoIf($["${CHOICE}" = "3"]?bridge)
 same => n,GotoIf($["${CHOICE}" = "4"]?holddial)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

 same => n(refer),Log(NOTICE,Transfer test (REFER) to the number ending in ${TEST_FORWARD:-4})
 same => n,Transfer(PJSIP/sip:${TEST_FORWARD}@${SIP_DOMAIN})
 same => n,Log(NOTICE,TRANSFER RESULT: ${TRANSFERSTATUS} (SIP ${TRANSFERSTATUSPROTOCOL}))
 same => n,Playback(beeperr)
 same => n,Hangup()

 same => n(bridge),Log(NOTICE,Bridge test (second call) to the number ending in ${TEST_FORWARD:-4})
 same => n,Dial(PJSIP/${TEST_FORWARD}@airtel,30)
 same => n,Log(NOTICE,BRIDGE RESULT: ${DIALSTATUS} (cause ${HANGUPCAUSE}))
 same => n,Playback(beeperr)
 same => n,Hangup()

; Test D. Stasis() returns at once with STASISSTATUS=FAILED when the script is not connected
; or ARI is off, and the caller hears an error beep.
 same => n(holddial),Log(NOTICE,Hold-then-dial test (Test D) to the number ending in ${TEST_FORWARD:-4})
 same => n,Stasis(home-phone-testd,${TEST_FORWARD})
 same => n,Log(NOTICE,TESTD left Stasis: ${STASISSTATUS})
 same => n,ExecIf($["${STASISSTATUS}" = "FAILED"]?Playback(beeperr))
 same => n,Hangup()

 same => n(deflect),Log(NOTICE,Deflect test (302) to the number ending in ${TEST_FORWARD:-4})
 same => n,Transfer(PJSIP/sip:${TEST_FORWARD}@${SIP_DOMAIN})
 same => n,Log(NOTICE,TRANSFER RESULT: ${TRANSFERSTATUS} (SIP ${TRANSFERSTATUSPROTOCOL}))
 same => n,Hangup()

; Test D, E2: a call in while the script waits. Only a test number or the forward number goes
; to the script; anyone else rings as usual. If the script has gone (a stale TESTD_WAIT),
; the call gets the normal stage-1 handling from "start".
 same => n(holdin),Set(LAST10=${CALLERID(num):-10})
 same => n,Log(NOTICE,TESTD call in while waiting from a number ending in ${CALLERID(num):-4})
 same => n,GotoIf($[${LEN(${LAST10})} != 10]?not_test)
 same => n,GotoIf($["${LAST10}" = "${TEST_FORWARD:-10}"]?holdin_go)
 same => n,GotoIf($["${TEST_CALLERS}" =~ "${LAST10}"]?holdin_go:not_test)
 same => n(holdin_go),Stasis(home-phone-testd,incoming)
 same => n,Log(NOTICE,TESTD left Stasis: ${STASISSTATUS})
 same => n,GotoIf($["${STASISSTATUS}" = "FAILED"]?start)
 same => n,Hangup()

; Outgoing test, started by hand from the shell (see README).
[outbound-test]
exten => s,1,Wait(1)
 same => n,Playback(hello-world)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Test D4 (tests/testd.py --conf): send one REFER inside this channel's own dialog, then go
; back to the script with the result. Only ARI reaches this context (POST
; /channels/{id}/continue). No endpoint uses it, so no call from outside can. The script sets
; D4_REFER_TO (the Refer-To, in <>) first. It holds a phone number, so nothing here logs it.
; The script continues here by the label "refer", which ARI checks: an image built without
; this context then gets a 404 and no REFER is sent.
[testd-refer]
exten => s,1(refer),Transfer(PJSIP/${D4_REFER_TO})
 same => n,Stasis(home-phone-testd,referred,${TRANSFERSTATUS},${TRANSFERSTATUSPROTOCOL})
 same => n,Hangup()
