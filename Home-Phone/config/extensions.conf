; Stage 1: prove the line works from this host. No assistant yet.
;
; A call from a number in HOME_PHONE_TEST_CALLERS is answered with "hello world" and a beep:
;   press 1 (or nothing): echo test, you hear your own voice back (two-way audio check)
;   press 2:              transfer test, Asterisk asks the carrier to move the call (SIP REFER)
;   press 3:              bridge test, Asterisk places a second call to the forward number and
;                         joins the two (needs the line to carry two calls at once)
;   press 4:              hold-then-dial test (Test D). tests/testd.py must be running and ARI
;                         must be on (HOME_PHONE_ARI_PASSWORD set); otherwise an error beep.
; With HOME_PHONE_TEST_MODE=deflect the call is not answered; Asterisk asks the
; carrier to redirect it instead (SIP 302). Every other caller just hears ringing.
;
; Ganpath (stage 2, phase 1): with HOME_PHONE_TEST_MODE=ganpath a test caller goes to the
; Ganpath service (Stasis app "ganpath") in place of the menu. See the [inbound] extension
; "ganpath" and the contexts [ganpath-fallback] and [ganpath-hangup] at the end of this file.
; In every other mode those are never reached.
;
; Ganpath, everyone (stage 2, phase 2a): with HOME_PHONE_TEST_MODE=ganpath_all every caller
; goes to Stasis(ganpath), not only test callers. WHO Ganpath answers is then the service's
; own setting (answer.callers: testers or everyone); it sends a caller it will not answer
; back to the label "ring" below. The service also tells this file which of the two is on,
; through the global GANPATH_EVERYONE (set over ARI, POST /asterisk/variable; 1 = everyone).
; That decides what a caller gets when the service is down or stops renewing the dead-man
; timer: while it is not 1, a caller who is not a test caller rings, as today, and never
; hears the fallback; once it is 1, everyone gets the fallback and a voicemail. Asterisk
; starts with it at 0. In the modes menu, deflect and ganpath nothing here changes.
;
; Test D, E2 (tests/testd.py --wait-in): while the script holds a caller it sets the global
; TESTD_WAIT=1, and a call in from a test number or the forward number goes to the script.
; Press 4 also runs Test D4 (tests/testd.py --conf), which sends its REFERs through
; [testd-refer] at the end of this file (--conf --flash sends none).
;
; NOTICE lines show only the last 4 digits of a number.
;
; The entrypoint renders this file at mode 600: in Ganpath mode it can hold the HA fallback
; webhook URL, which carries a webhook ID.

[globals]
; Set by the Ganpath service over ARI (answer.callers = everyone gives 1). Only read in
; ganpath_all mode. 0 after an Asterisk start or a dialplan reload, until the service sets it.
GANPATH_EVERYONE=0
TEST_CALLERS=${HOME_PHONE_TEST_CALLERS}
TEST_FORWARD=${HOME_PHONE_TEST_FORWARD}
TEST_MODE=${HOME_PHONE_TEST_MODE}
SIP_DOMAIN=${HOME_PHONE_SIP_DOMAIN}
TESTD_WAIT=0

[from-airtel]
exten => _[+0-9].,1,Goto(inbound,s,1)
exten => s,1,Goto(inbound,s,1)

[inbound]
exten => s,1,GotoIf($["${TESTD_WAIT}" = "1"]?holdin)
 same => n(start),Set(LAST10=${CALLERID(num):-10})
 same => n,Log(NOTICE,Incoming call from a number ending in ${CALLERID(num):-4})
 same => n,GotoIf($[${LEN(${LAST10})} != 10]?not_test)
 same => n,GotoIf($["${TEST_CALLERS}" =~ "${LAST10}"]?test)
 same => n(not_test),Set(GP_TESTER=0)
; ganpath_all: a caller who is not a test caller (a withheld or short number too) goes to the
; service, which decides. The label "ring" stays below this line, so a caller the service
; sends back never comes through here again.
 same => n,GotoIf($["${TEST_MODE}" = "ganpath_all"]?ganpath,1)
 same => n(ringlog),Log(NOTICE,Not a test caller: letting it ring)
; The Ganpath service sends a caller who is not on its testers list (or whom it will not
; answer) back here, by the label "ring" (ARI continue to inbound, s, ring). The dead-man
; timer is cancelled here, once the caller has left Stasis: a long ring never ends in the T
; path, and a continue the service could not send leaves the timer armed, so the T path then
; rings the caller. The label "down" below comes here too. Outside Ganpath mode no timer is
; set and the line does nothing.
 same => n(ring),Set(TIMEOUT(absolute)=0)
 same => n,Ringing()
 same => n,Wait(40)
 same => n,Hangup()

 same => n(test),Set(GP_TESTER=1)
 same => n,GotoIf($["${TEST_MODE}" = "deflect"]?deflect)
 same => n,GotoIf($["${TEST_MODE}" = "ganpath"]?ganpath,1)
 same => n,GotoIf($["${TEST_MODE}" = "ganpath_all"]?ganpath,1)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Read(CHOICE,beep,1,,1,8)
 same => n,GotoIf($["${CHOICE}" = "2"]?refer)
 same => n,GotoIf($["${CHOICE}" = "3"]?bridge)
 same => n,GotoIf($["${CHOICE}" = "4"]?holddial)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

 same => n(refer),Log(NOTICE,Transfer test (REFER) to the number ending in ${TEST_FORWARD:-4})
 same => n,Transfer(PJSIP/sip:${TEST_FORWARD}@${SIP_DOMAIN})
 same => n,Log(NOTICE,TRANSFER RESULT: ${TRANSFERSTATUS} (SIP ${TRANSFERSTATUSPROTOCOL}))
 same => n,Playback(beeperr)
 same => n,Hangup()

 same => n(bridge),Log(NOTICE,Bridge test (second call) to the number ending in ${TEST_FORWARD:-4})
 same => n,Dial(PJSIP/${TEST_FORWARD}@airtel,30)
 same => n,Log(NOTICE,BRIDGE RESULT: ${DIALSTATUS} (cause ${HANGUPCAUSE}))
 same => n,Playback(beeperr)
 same => n,Hangup()

; Test D. Stasis() returns at once with STASISSTATUS=FAILED when the script is not connected
; or ARI is off, and the caller hears an error beep.
 same => n(holddial),Log(NOTICE,Hold-then-dial test (Test D) to the number ending in ${TEST_FORWARD:-4})
 same => n,Stasis(home-phone-testd,${TEST_FORWARD})
 same => n,Log(NOTICE,TESTD left Stasis: ${STASISSTATUS})
 same => n,ExecIf($["${STASISSTATUS}" = "FAILED"]?Playback(beeperr))
 same => n,Hangup()

 same => n(deflect),Log(NOTICE,Deflect test (302) to the number ending in ${TEST_FORWARD:-4})
 same => n,Transfer(PJSIP/sip:${TEST_FORWARD}@${SIP_DOMAIN})
 same => n,Log(NOTICE,TRANSFER RESULT: ${TRANSFERSTATUS} (SIP ${TRANSFERSTATUSPROTOCOL}))
 same => n,Hangup()

; Test D, E2: a call in while the script waits. Only a test number or the forward number goes
; to the script; anyone else rings as usual. If the script has gone (a stale TESTD_WAIT),
; the call gets the normal stage-1 handling from "start".
 same => n(holdin),Set(LAST10=${CALLERID(num):-10})
 same => n,Log(NOTICE,TESTD call in while waiting from a number ending in ${CALLERID(num):-4})
 same => n,GotoIf($[${LEN(${LAST10})} != 10]?ringlog)
 same => n,GotoIf($["${LAST10}" = "${TEST_FORWARD:-10}"]?holdin_go)
 same => n,GotoIf($["${TEST_CALLERS}" =~ "${LAST10}"]?holdin_go:ringlog)
 same => n(holdin_go),Stasis(home-phone-testd,incoming)
 same => n,Log(NOTICE,TESTD left Stasis: ${STASISSTATUS})
 same => n,GotoIf($["${STASISSTATUS}" = "FAILED"]?start)
 same => n,Hangup()

; Ganpath mode: a test caller goes to the Ganpath service (in ganpath_all mode, every caller). The service renews the dead-man
; timer, TIMEOUT(absolute), on the caller's channel while it runs. If it stops renewing, the
; timer runs out inside Stasis() and Asterisk goes to the T extension of this context, which
; sends a caller still on the line to [ganpath-fallback]. The T extension must sit in the
; same context as the Stasis() call. TIMEOUT(absolute)=0 would cancel the timer, so the
; entrypoint never renders 0 here (HOME_PHONE_GANPATH_DEADMAN_S, at least 1).
; Stasis() returns at once with STASISSTATUS=FAILED when the service is not connected to ARI.
; GP_TESTER (1 for a test caller, 0 for anyone else) and GANPATH_EVERYONE decide what a
; caller gets then (label "down" below): a test caller, or anyone once GANPATH_EVERYONE is 1,
; goes to the fallback; any other caller rings.
exten => ganpath,1,Log(NOTICE,Ganpath call from a number ending in ${CALLERID(num):-4})
 same => n,Set(TIMEOUT(absolute)=${HOME_PHONE_GANPATH_DEADMAN_S})
 same => n,Set(CHANNEL(hangup_handler_push)=ganpath-hangup,s,1)
 same => n,Stasis(ganpath,inbound)
 same => n,GotoIf($["${STASISSTATUS}" = "FAILED"]?down)
 same => n,Hangup()
 same => n(down),GotoIf($["${GP_TESTER}" = "1"]?ganpath-fallback,s,1)
 same => n,GotoIf($["${GANPATH_EVERYONE}" = "1"]?ganpath-fallback,s,1)
 same => n,Set(GANPATH_DONE=1)
 same => n,Goto(inbound,s,ring)

; The dead-man timer ran out: same choice as "down".
exten => T,1,Goto(inbound,ganpath,down)

; The Ganpath service sends a caller here (ARI continue, label down) when it lets go of a caller
; it does not answer: a start that failed, a call while it stops, its restart clean-up. Same
; choice as "down", so while GANPATH_EVERYONE is not 1 a non-test caller rings.
[ganpath-down]
exten => s,1(down),Goto(inbound,ganpath,down)

; Outgoing test, started by hand from the shell (see README).
[outbound-test]
exten => s,1,Wait(1)
 same => n,Playback(hello-world)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Test D4 (tests/testd.py --conf): send one REFER inside this channel's own dialog, then go
; back to the script with the result. Only ARI reaches this context (POST
; /channels/{id}/continue). No endpoint uses it, so no call from outside can. The script sets
; D4_REFER_TO (the Refer-To, in <>) first. It holds a phone number, so nothing here logs it.
; The script continues here by the label "refer", which ARI checks: an image built without
; this context then gets a 404 and no REFER is sent.
[testd-refer]
exten => s,1(refer),Transfer(PJSIP/${D4_REFER_TO})
 same => n,Stasis(home-phone-testd,referred,${TRANSFERSTATUS},${TRANSFERSTATUSPROTOCOL})
 same => n,Hangup()

; Ganpath fallback: the service is down, or stopped renewing the dead-man timer. Alert HA
; (when a webhook is set), play the recorded message and take a voicemail.
; - The timer here is HOME_PHONE_VM_MAX_S plus 60 s, so the message and the recording fit.
; - GANPATH_FALLBACK=1 tells the hangup handler that this call was already reported.
; - The voicemail file: /var/spool/asterisk/recording/voicemail/ganpath-vm-<epoch>-<id>-<tail>.wav
;   in the recording tmpfs (in RAM). <epoch> is the start time, <id> the channel's unique id
;   with dots as hyphens (the HA alert carries it as vm=), <tail> the last 4 digits of the
;   caller's number or "none". No full number is in a file name. The Ganpath service fetches
;   and deletes the file over ARI; the sweep job in this container deletes it
;   HOME_PHONE_VM_RETENTION_H hours after it was written, whether or not the service runs.
; - The message is the prompt file ganpath-unavailable.wav in the Ganpath prompts folder,
;   mounted read-only at /usr/share/asterisk/sounds/ganpath. If it is missing, Playback()
;   goes straight on and the caller hears only the beep.
; - CURL() is called only when HOME_PHONE_HA_FALLBACK_WEBHOOK is set (the entrypoint renders
;   1 or 0 into the GotoIf). 2 s to connect and 3 s in all. The webhook gets only the last
;   4 digits (VMTAIL), so no full number sits in HA's automation traces.
; - Record(): ends after HOME_PHONE_VM_SILENCE_S of silence, at HOME_PHONE_VM_MAX_S, or on #.
;   Option k keeps the file when the caller hangs up, which is how most voicemails end;
;   without it Record() deletes the file on hang-up. No q, so the caller hears the beep.
[ganpath-fallback]
exten => s,1,Set(TIMEOUT(absolute)=${HOME_PHONE_GANPATH_FALLBACK_S})
 same => n,Set(GANPATH_FALLBACK=1)
 same => n,Answer()
 same => n,Set(VMID=${REPLACE(UNIQUEID,.,-)})
 same => n,Set(VMTAIL=${FILTER(0-9,${CALLERID(num)}):-4})
 same => n,GotoIf($[${LEN(${VMTAIL})} = 4]?tail_ok)
 same => n,Set(VMTAIL=none)
 same => n(tail_ok),Log(NOTICE,Ganpath fallback for a number ending in ${VMTAIL})
 same => n,GotoIf($[${HOME_PHONE_GANPATH_HA_ALERT} = 0]?play)
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(r=${CURL(${HOME_PHONE_HA_FALLBACK_WEBHOOK_CONF},caller=${VMTAIL}&id=${UNIQUEID}&vm=${VMID})})
 same => n(play),Playback(ganpath/ganpath-unavailable)
 same => n,Record(/var/spool/asterisk/recording/voicemail/ganpath-vm-${EPOCH}-${VMID}-${VMTAIL}.wav,${HOME_PHONE_VM_SILENCE_S},${HOME_PHONE_VM_MAX_S},k)
 same => n,Hangup()
; The fallback's own timer ran out. Record() keeps the file (k).
exten => T,1,Hangup()
; Every way out of the fallback ends here, so the voicemail line is logged once. A caller who
; hangs up during Record() is the usual case: Record() then returns -1 and the dialplan stops
; at once, so a Log() after it would never run (apps/app_record.c, 22.12.0). RECORD_STATUS is
; SILENCE, HANGUP, DTMF (#) or TIMEOUT (the length limit), and empty when the caller hung up
; before the beep.
exten => h,1,Log(NOTICE,Voicemail from a number ending in ${VMTAIL}: ${RECORD_STATUS})

; Hangup handler for a Ganpath call: tells HA about a call that neither the service nor the
; fallback reported. The service sets GANPATH_DONE=1 once the call is in its own call log.
[ganpath-hangup]
exten => s,1,GotoIf($["${GANPATH_DONE}${GANPATH_FALLBACK}" != ""]?done)
 same => n,GotoIf($[${HOME_PHONE_GANPATH_HA_ALERT} = 0]?done)
; Only the last 4 digits go to HA, as in the fallback.
 same => n,Set(HTAIL=${FILTER(0-9,${CALLERID(num)}):-4})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(r=${CURL(${HOME_PHONE_HA_FALLBACK_WEBHOOK_CONF},caller=${HTAIL}&id=${UNIQUEID}&hungup=1)})
 same => n(done),Return()
