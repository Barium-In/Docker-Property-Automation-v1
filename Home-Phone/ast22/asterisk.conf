; Asterisk 22 image only. Dockerfile.ast22 copies this file to /etc/asterisk/asterisk.conf.
; It is kept out of config/ because the entrypoint renders every config/*.conf into
; /etc/asterisk for the 20.6 image as well, and that image keeps Ubuntu's own file.
;
; The paths are the ones the 20.6 image runs with. Ubuntu's asterisk.conf marks its
; [directories] section as a template, (!), so Asterisk ignores it and uses the paths
; compiled into the 20.6 binary. Dockerfile.ast22 compiles the same data directory in
; (ASTDATADIR=/usr/share/asterisk), and this file states every path once more:
; - prompts: <astdatadir>/sounds/en, from Ubuntu's sound packages;
; - music on hold: /usr/share/asterisk/moh, the directory config/musiconhold.conf names;
; - ARI's API docs (rest-api) and the XML docs (documentation) from the build.
; With no astkeydir line, keys go in <astdatadir>/keys, as on 20.6. Nothing here uses keys.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astdatadir => /usr/share/asterisk
astagidir => /usr/share/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astcachedir => /var/cache/asterisk
astsbindir => /usr/sbin
