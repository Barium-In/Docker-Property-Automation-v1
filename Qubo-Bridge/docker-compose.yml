# Qubo HCM01B → local RTSP, for Home Assistant. Two services:
#   mediamtx     — RTSP/WebRTC server HA connects to (rtsp://<vm-ip>:8554/qubo)
#   qubo-bridge  — pulls the camera's encrypted P2P stream over the LAN,
#                  decrypts it, and publishes H.264(+AAC) to mediamtx.
#
# HOST NETWORKING is required: the camera streams P2P UDP to the VM's LAN IP,
# which Docker's bridge NAT would break. See README.
services:
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_VERSION}
    container_name: qubo-mediamtx
    restart: unless-stopped
    network_mode: host
    # The read login comes from the root .env. Index 1 is the second user in mediamtx.yml.
    environment:
      - "MTX_AUTHINTERNALUSERS_1_USER=${QUBO_RTSP_READ_USER:?set it in the root .env}"
      - "MTX_AUTHINTERNALUSERS_1_PASS=${QUBO_RTSP_READ_PASS:?set it in the root .env}"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  qubo-bridge:
    build: .
    image: qubo-bridge:local
    container_name: qubo-bridge
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mediamtx
    env_file:
      - ../.env
    environment:
      - TZ=${TZ}
      - RTSP_PUBLISH_URL=${QUBO_RTSP_PUBLISH_URL:-rtsp://127.0.0.1:8554/qubo}
      - LOG_LEVEL=${QUBO_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data        # qubopy session + stable device id persist here
