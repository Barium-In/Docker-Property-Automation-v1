; ARI (call control over HTTP) on 127.0.0.1:8088 (http.conf). Two users, each present only
; while its password is set in the root .env; the entrypoint deletes the section of a user
; whose password is empty. ARI is on when either is set.
; - homephone: Test D (tests/testd.py), HOME_PHONE_ARI_PASSWORD.
; - ganpath: the Ganpath service, HOME_PHONE_GANPATH_ARI_PASSWORD.
; Keep each user's comments above this header block, not inside a user's section: the
; entrypoint deletes a section from its [header] to the next [header] or the end of the file.
[general]
enabled=${HOME_PHONE_ARI_ENABLED}

[homephone]
type=user
read_only=no
password=${HOME_PHONE_ARI_PASSWORD_CONF}
password_format=plain

[ganpath]
type=user
read_only=no
password=${HOME_PHONE_GANPATH_ARI_PASSWORD_CONF}
password_format=plain
