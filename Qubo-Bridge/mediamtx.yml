# mediamtx config for the Qubo bridge.
# The bridge's ffmpeg publishes to path "qubo"; Home Assistant reads it.
logLevel: info
rtspTransports: [tcp]

# --- protocols ---
rtsp: yes
rtspAddress: :8554
webrtc: yes
webrtcAddress: :8889
hls: no
rtmp: no
srt: no
api: no

# --- auth ---------------------------------------------------------------------
# Localhost (the bridge, publishing from 127.0.0.1) may publish+read with no
# credentials. Everyone else (Home Assistant, any LAN/tailnet client) must
# supply the read login. This both password-protects viewing AND stops anyone
# on the LAN from hijacking the "qubo" path by publishing to it.
#
# Don't edit the placeholders: docker-compose.yml overrides this second user with
# QUBO_RTSP_READ_USER / QUBO_RTSP_READ_PASS from the root .env. If you add a user
# before it, update the MTX_AUTHINTERNALUSERS_1_* index in docker-compose.yml.
authInternalUsers:
  - user: any
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
      - action: read
  - user: REPLACE_WITH_READ_USER
    pass: REPLACE_WITH_READ_PASS
    permissions:
      - action: read

paths:
  qubo:
    source: publisher
