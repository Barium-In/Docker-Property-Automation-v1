; ARI (call control over HTTP), used only by Test D (tests/testd.py), on 127.0.0.1:8088 (http.conf).
; Off unless HOME_PHONE_ARI_PASSWORD is set in the root .env. When it is unset, the entrypoint
; also deletes the [homephone] user, from its header to the end of this file, so keep it last.
[general]
enabled=${HOME_PHONE_ARI_ENABLED}

[homephone]
type=user
read_only=no
password=${HOME_PHONE_ARI_PASSWORD_CONF}
password_format=plain
